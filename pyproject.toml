[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skemo"
version = "0.1.0"
description = "Build ERPs and CRMs from metadata: describe a form, get its Postgres table, API and screens."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Arpit Kumar" }]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
skemo = "skemo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
