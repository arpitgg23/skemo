# Postgres for development and tests: `docker compose up -d`
# Port 5433 so it doesn't clash with another Postgres on the default 5432.
services:
  postgres:
    image: postgres:16
    container_name: dhancha-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - dhancha-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dhancha-pg-data:
